<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>確認一覧カード</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2933; --sub: #5f6b7a; --line: #dde2e8;
  --accent: #1f4e78; --accent-soft: #e6eef6; --ok: #2f7d4f; --ok-soft: #e5f3ea; --warn: #a15c00; --warn-soft: #fbf0df;
  --c0: #c2410c; --c1: #a16207; --c2: #7c3aed; --c3: #1d4ed8; --c4: #15803d; --c5: #0f766e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191e; --panel: #1e242b; --ink: #e6e9ed; --sub: #9aa5b1; --line: #333b45;
    --accent: #7fb2e5; --accent-soft: #243443; --ok: #6cc28f; --ok-soft: #1f3328; --warn: #e0a54f; --warn-soft: #3a2d1a;
    --c0: #fb923c; --c1: #facc15; --c2: #c4b5fd; --c3: #93c5fd; --c4: #86efac; --c5: #5eead4;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.7 "Yu Gothic UI", "Meiryo", system-ui, sans-serif; }
header { padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
header button { padding: 3px 10px; font-size: 13px; white-space: nowrap; }
@media (max-width: 760px) { header .file { display: none; } }
header .file { color: var(--sub); font-size: 13px; }
header .spacer { flex: 1; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
#drop { margin: 40px auto; max-width: 560px; padding: 40px 24px; border: 2px dashed var(--line); border-radius: 10px; text-align: center; background: var(--panel); }
#drop.over { border-color: var(--accent); background: var(--accent-soft); }
#drop p { margin: 6px 0; color: var(--sub); }
main { display: none; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 10px 16px 16px; max-width: 1080px; margin: 0 auto; }
main.on { display: grid; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.strip { padding: 8px 12px; }
#filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
#filters button { padding: 1px 10px; font-size: 12px; white-space: nowrap; border-radius: 999px; }
#filters button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
/* 色付きの点（いつも出す） */
/* 進み具合のバー（全件）：決定済み・保留・書きかけ・未回答の長さで塗り分ける */
#bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--line); margin: 4px 0 2px; }
#bar span { display: block; height: 100%; }
#bar .done { background: var(--ok); }
#bar .hold { background: var(--warn); }
#bar .draft { background: var(--accent); opacity: .55; }
#bartext { font-size: 12px; color: var(--sub); }
#bartext b { color: var(--ink); font-size: 13px; }
#bartext .k { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 3px 0 10px; vertical-align: 0; }
/* 状態と分類のラベル（一覧・カードで同じ） */
.tag { display: inline-block; font-size: 10.5px; line-height: 1.5; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--sub); white-space: nowrap; }
.tag.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.tag.hold { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.tag.draft, .tag.redo { border-color: var(--accent); border-style: dashed; color: var(--accent); }
/* 件名付きの一覧：いつもはしまっておき、ヘッダーの三本線で左から出す */
#listbar { font-size: 18px; line-height: 1; padding: 4px 9px; }
#listbar[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
#side { position: fixed; top: 0; bottom: 0; left: 0; width: min(340px, 88vw); z-index: 20; border-radius: 0 10px 10px 0; display: flex; flex-direction: column;
  transform: translateX(-105%); transition: transform .18s ease; box-shadow: 4px 0 18px rgba(0,0,0,.18); }
main.listopen #side { transform: none; }
#side .sidehead { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--sub); }
#side .sidehead button { padding: 0 8px; }
#list { flex: 1; overflow: auto; }
#list .item { padding: 7px 12px; border-bottom: 1px solid var(--line); border-left: 4px solid var(--kc, transparent); font-size: 13px; line-height: 1.5; cursor: pointer; }
#list .item .tags { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-bottom: 1px; }
#list .item.cur { background: var(--accent-soft); }
#list .no { color: var(--sub); font-size: 11px; }
#checkwrap { margin-top: 4px; }
#checkwrap summary { font-size: 12px; color: var(--sub); cursor: pointer; }
#checkwrap summary .bad { color: var(--warn); font-weight: bold; }
#check { font-size: 12px; padding: 6px 0 2px; max-width: 420px; }
#check .row { display: flex; justify-content: space-between; gap: 8px; }
#check .bad { color: var(--warn); font-weight: bold; }
#check .good { color: var(--ok); font-weight: bold; }
#check hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
#card { border-top: 4px solid var(--accent); }
.cbody { padding: 12px 20px 10px; }
.meta { display: flex; gap: 10px; align-items: baseline; font-size: 12px; color: var(--sub); }
.meta .kind { display: flex; gap: 4px; }
.meta .pos { margin-left: auto; }
.title { font-size: 21px; font-weight: bold; line-height: 1.4; margin: 2px 0 0; }
.where { font-size: 13px; color: var(--sub); }
.lead { font-size: 16px; line-height: 1.65; margin: 8px 0 0; white-space: pre-wrap; }
.rest { font-size: 13px; line-height: 1.7; color: var(--sub); white-space: pre-wrap; margin: 2px 0 0; }
.idea { margin: 10px 0 0; padding: 8px 14px; border-radius: 8px; background: var(--ok-soft); }
.idea .tag { font-size: 11px; color: var(--ok); font-weight: bold; }
.idea .main { font-size: 17px; font-weight: bold; line-height: 1.5; white-space: pre-wrap; }
.idea .why { font-size: 12px; line-height: 1.6; color: var(--sub); white-space: pre-wrap; margin-top: 2px; }
.how { margin: 10px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--sub); white-space: pre-wrap; padding-left: 10px; border-left: 3px solid var(--line); }
.how b { display: block; color: var(--ink); font-size: 11px; }
.seen { margin: 10px 0 0; padding: 6px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 14px; line-height: 1.6; }
.seen b { color: var(--accent); font-size: 11px; margin-right: 8px; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
@media (max-width: 640px) { .compare { grid-template-columns: 1fr; } }
.compare > div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 0; }
.compare h3 { margin: 0 0 4px; font-size: 11px; color: var(--sub); font-weight: bold; }
.quote { font-size: 12px; line-height: 1.6; white-space: pre-wrap; margin: 0 0 6px; padding-left: 8px; border-left: 3px solid var(--line); }
.quote .src { display: block; font-size: 10.5px; color: var(--sub); }
.compare .none { font-size: 12px; color: var(--sub); }
.compare img { max-width: 100%; border: 1px solid var(--line); border-radius: 4px; display: block; margin-top: 4px; }
.box { border-left: 3px solid var(--line); padding: 4px 12px; margin: 6px 0; white-space: pre-wrap; font-size: 13px; }
.box b { display: block; font-size: 12px; color: var(--sub); }
.box.advice { border-color: var(--ok); background: var(--ok-soft); }
details { margin: 6px 0 0; }
summary { cursor: pointer; color: var(--sub); font-size: 12px; }
.answer { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); border-radius: 0 0 10px 10px; padding: 8px 16px 10px; box-shadow: 0 -6px 12px -10px rgba(0,0,0,.25); }
.answer label { display: block; font-size: 12px; color: var(--sub); margin: 6px 0 2px; }
.answer label[for=memo] { display: none; }
.results { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
.results button { padding: 5px 6px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 5px; line-height: 1.3; white-space: nowrap; }
.results button .ic { font-size: 15px; font-weight: bold; }
.results button .key { font-size: 10px; color: var(--sub); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; line-height: 1.3; }
.results button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.results button[data-kind="advice"].on { background: var(--ok); border-color: var(--ok); }
.results button.on .key { color: inherit; opacity: .8; }
.results button.on * { pointer-events: none; }
.results button * { pointer-events: none; }
textarea { width: 100%; min-height: 70px; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
#memo { min-height: 32px; height: 32px; margin-top: 6px; resize: vertical; }
#memo:focus, #memo.has { height: 72px; }
#notice:empty { display: none; }
#notice { max-width: 860px; margin: 10px auto 0; padding: 10px 16px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-soft); white-space: pre-wrap; }
#notice button { margin: 8px 8px 0 0; }
.nav { display: flex; gap: 8px; margin-top: 6px; }
.nav #decide, .nav #redo { flex: 1; padding: 5px; font-size: 14px; }
.changed { color: var(--warn); font-size: 12px; }
.hint { font-size: 12px; color: var(--sub); }
</style>
</head>
<body>
<header>
  <button id="listbar" aria-label="一覧" aria-expanded="false" aria-controls="side" title="一覧">☰</button>
  <h1>確認一覧カード</h1>
  <span class="file" id="fname"></span>
  <span class="spacer"></span>
  <b id="progress"></b>
  <span class="changed" id="dirty"></span>
  <button id="qaout" disabled title="「QAに起票」にして決定したものだけを、QA表の列の並びで xlsx にします">起票分を出力</button>
  <button class="primary" id="save" disabled>答えを入れた xlsx を保存</button>
</header>

<div id="drop">
  <p><b>受け入れ基準と要確認事項か、確認一覧の xlsx を、ここに置くか選んでください</b></p>
  <p>ファイルはこのパソコンの中だけで読みます（どこにも送りません）</p>
  <p>補足（&lt;機能名&gt;_補足.json）があれば、一緒に選ぶか置いてください</p>
  <p><label for="pick">xlsx ファイルを選ぶ</label> <input type="file" id="pick" accept=".xlsx,.json" multiple aria-label="xlsx ファイルを選ぶ"></p>
  <p id="status" style="color: var(--warn); font-weight: bold;">このページは今、動いていません。Edge か Chrome で開き直してください（Claude のアプリの中では動きません）。</p>
</div>

<div id="notice" role="status" aria-live="polite"></div>

<main id="main">
  <div class="panel strip">
    <div id="filters"></div>
    <div id="bar" role="img"></div>
    <div id="bartext"></div>
    <details id="checkwrap"><summary id="checksum"></summary><div id="check"></div></details>
  </div>
  <aside class="panel" id="side" aria-label="一覧"><div class="sidehead"><span>一覧</span><button id="sideclose" aria-label="一覧を閉じる">×</button></div><div id="list"></div></aside>
  <section class="panel" id="card"></section>
</main>

<script>
const NS = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
const COVER = "表紙";
const AI_RULE = "AI が補った業務の決まり";
// 要確認事項のシートに入る、業務に確かめてもらう指摘事項（確認一覧と同じ No. の行）
const FINDING_KINDS = ["資料の食い違い", "資料の書き漏れ"];
const FINDING_LABEL = "資料の指摘";
// 確認一覧の形（答えてもらう問い・おすすめでいいか・ふつうはこうする）は、絞り込みでは「その他」の1つにまとめる（カードの中には区分を出す）
const SHAPE_KINDS = ["答えてもらう問い", "おすすめでいいか", "ふつうはこうする"];
const OTHER_LABEL = "その他";   // 絞り込みでは、食い違いと書き漏れを1つにまとめる
const num = (text, re) => { const m = text.match(re); return m ? +m[1] : null; };

// 読めるシートの形。どちらも1行ごとに 確認結果・回答・備考・QA起票文 を書く
const EDIT = ["確認結果", "回答", "備考", "QA起票文"];
const LAYOUTS = [
  {
    sheet: "要確認事項", kind: "種別", ask: "確認内容", where: "理由", edit: EDIT,
    more: ["確認の分け方", "共通の問い", "機能要件詳細の記載", "テーブル定義・現行・開発環境の記載", "関係する受け入れ基準"],
    // 業務・開発の分と、資料の指摘・その他（確認の分け方が付いた行。ある機能だけ）で絞れる
    filters: rows => [["業務の分", r => r.v["種別"] !== "開発"], ["開発の分", r => r.v["種別"] !== "業務"],
      ...(rows.some(r => FINDING_KINDS.includes(r.v["理由"])) ? [[FINDING_LABEL, r => FINDING_KINDS.includes(r.v["理由"])]] : []),
      ...(rows.some(r => SHAPE_KINDS.includes(r.v["確認の分け方"])) ? [[OTHER_LABEL, r => SHAPE_KINDS.includes(r.v["確認の分け方"])]] : [])],
    // 表紙の「件数」の行：要確認事項 n 件（業務 a・開発 b。両方は両方に数える）・…・AI が補った業務の決まり c・資料の食い違い d・資料の書き漏れ e
    check: (rows, cover) => {
      const line = cover.find(t => t.includes("要確認事項") && / 件/.test(t) && t.includes("業務 ")) || "";
      const issues = rows.filter(r => r.v["理由"] !== AI_RULE && !FINDING_KINDS.includes(r.v["理由"]));
      return [
        ["要確認事項", issues.length, num(line, /要確認事項 (\d+) 件/)],
        ["うち業務（両方を含む）", issues.filter(r => r.v["種別"] !== "開発").length, num(line, /業務 (\d+)/)],
        ["うち開発（両方を含む）", issues.filter(r => r.v["種別"] !== "業務").length, num(line, /開発 (\d+)/)],
        [AI_RULE, rows.filter(r => r.v["理由"] === AI_RULE).length, num(line, /AI が補った業務の決まり (\d+)/) ?? 0],
        ...FINDING_KINDS.map(k => [k, rows.filter(r => r.v["理由"] === k).length, num(line, new RegExp(k + " ([0-9]+)")) ?? 0]),
      ];
    },
  },
  {
    sheet: "確認一覧", kind: "区分", ask: "確かめてほしいこと", where: "どこのことか", edit: EDIT,
    more: ["資料・開発環境の記載", "関係する AC"],
    filters: rows => [...new Set(rows.map(r => FINDING_KINDS.includes(r.v["区分"]) ? FINDING_LABEL : SHAPE_KINDS.includes(r.v["区分"]) ? OTHER_LABEL : r.v["区分"]))]
      .sort((a, b) => (a === OTHER_LABEL) - (b === OTHER_LABEL))
      .map(k => [k, k === FINDING_LABEL ? r => FINDING_KINDS.includes(r.v["区分"]) : k === OTHER_LABEL ? r => SHAPE_KINDS.includes(r.v["区分"]) : r => r.v["区分"] === k]),
    // 表紙の「この資料」の行：区分ごとに「<区分> <n> 件」
    check: (rows, cover) => {
      const line = cover.find(t => / \d+ 件・/.test(t)) || "";
      const want = {};
      for (const part of line.slice(line.lastIndexOf("。") + 1).split("・")) {
        const m = part.match(/^(.*) (\d+) 件$/);
        if (m) want[m[1]] = +m[2];
      }
      const kinds = [...new Set([...Object.keys(want), ...rows.map(r => r.v["区分"])])];
      return [["表紙の件数（合計）", rows.length, Object.values(want).reduce((a, b) => a + b, 0)],
        ...kinds.map(k => [k, rows.filter(r => r.v["区分"] === k).length, want[k] ?? 0])];
    },
  },
];

let book = null;
let supp = {};   // 補足（<機能名>_補足.json）：{ No.: { 原文: [{出典, 文}], 所見, 画像: [{説明, src}] } }。このパソコンの中だけで読む   // { zip, name, lay, sheets, heads, rows, cover, added, headStyle }
let cur = 0, filter = "すべて";

// ---------- zip（xlsx の入れ物）。外の部品を使わず、ブラウザの機能だけで読み書きする ----------
const CRC = new Uint32Array(256).map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
function crc32(bytes) { let c = 0xFFFFFFFF; for (const b of bytes) c = CRC[(c ^ b) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function pipe(bytes, stream) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }

function unzip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = u8.length - 22;
  while (eocd >= 0 && dv.getUint32(eocd, true) !== 0x06054b50) eocd--;
  if (eocd < 0) throw new Error("xlsx として読めませんでした");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const entries = [];
  for (let i = 0; i < count; i++) {
    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);
    const e = {
      method: dv.getUint16(p + 10, true), time: dv.getUint16(p + 12, true), date: dv.getUint16(p + 14, true),
      crc: dv.getUint32(p + 16, true), csize: dv.getUint32(p + 20, true), usize: dv.getUint32(p + 24, true),
      name: new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen)),
    };
    const local = dv.getUint32(p + 42, true);
    const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
    e.data = u8.slice(start, start + e.csize);
    entries.push(e);
    p += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

async function entryText(e) {
  if (e.method === 0) return new TextDecoder().decode(e.data);
  if (e.method === 8) return new TextDecoder().decode(await pipe(e.data, new DecompressionStream("deflate-raw")));
  throw new Error(`読めない圧縮の形です（${e.name}）`);
}

async function setEntryText(e, text) {
  const raw = new TextEncoder().encode(text);
  e.crc = crc32(raw); e.usize = raw.length; e.method = 8;
  e.data = await pipe(raw, new CompressionStream("deflate-raw")); e.csize = e.data.length;
}

function zip(entries) {
  const parts = [], central = [];
  let offset = 0;
  const put = (dv, fields) => fields.forEach(([o, v, n]) => n === 4 ? dv.setUint32(o, v, true) : dv.setUint16(o, v, true));
  for (const e of entries) {
    const name = new TextEncoder().encode(e.name), flags = 0x800;  // 名前は UTF-8。データ記述子は使わない
    const head = new DataView(new ArrayBuffer(30));
    put(head, [[0, 0x04034b50, 4], [4, 20, 2], [6, flags, 2], [8, e.method, 2], [10, e.time, 2], [12, e.date, 2],
      [14, e.crc, 4], [18, e.csize, 4], [22, e.usize, 4], [26, name.length, 2], [28, 0, 2]]);
    const cd = new DataView(new ArrayBuffer(46));
    put(cd, [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, flags, 2], [10, e.method, 2], [12, e.time, 2], [14, e.date, 2],
      [16, e.crc, 4], [20, e.csize, 4], [24, e.usize, 4], [28, name.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, offset, 4]]);
    parts.push(head, name, e.data);
    central.push(cd, name);
    offset += 30 + name.length + e.data.length;
  }
  const size = central.reduce((n, x) => n + x.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  put(end, [[0, 0x06054b50, 4], [8, entries.length, 2], [10, entries.length, 2], [12, size, 4], [16, offset, 4]]);
  return new Blob([...parts, ...central, end], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

// ---------- xlsx を読む ----------
function colOf(ref) { return ref.replace(/\d+/g, ""); }
function rowOf(ref) { return +ref.replace(/\D+/g, ""); }
function colIndex(col) { return [...col].reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0); }
function colName(n) { let s = ""; for (; n > 0; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + (n - 1) % 26) + s; return s; }

// 文字の要素の中身。Excel が付ける読み仮名（rPh）は除く
function plain(node) {
  return [...node.getElementsByTagNameNS(NS, "t")].filter(x => x.parentNode.localName !== "rPh").map(x => x.textContent).join("");
}

function cellText(c, shared) {
  const t = c.getAttribute("t");
  if (t === "inlineStr") return plain(c);
  const v = c.getElementsByTagNameNS(NS, "v")[0];
  if (!v) return "";
  if (t === "s") return shared[+v.textContent] ?? "";
  return v.textContent;
}

// ボタン（両方のカードで同じ）。おすすめどおりは、おすすめの無い問いには出さない。回答を書くは、回答の欄に答えが要る
const KINDS = [["advice", "おすすめどおり"], ["answer", "回答を書く"], ["ask", "QAに起票"], ["hold", "保留"], ["none", "不要"]];
const KIND_ICON = { advice: "✓", answer: "✎", ask: "？", hold: "⏸", none: "✕" };
// 一覧の左端の色：区分（確認一覧）・種別（要確認事項）ごと。無い名前は出てきた順に色を回す
const KIND_COLOR = { "資料の食い違い": 0, "資料の書き漏れ": 1, "共通の問い": 2, "答えてもらう問い": 3, "おすすめでいいか": 4, "ふつうはこうする": 5, "業務": 3, "開発": 2, "両方": 5 };
function kindColor(name) {
  if (name in KIND_COLOR) return `var(--c${KIND_COLOR[name]})`;
  const names = [...new Set(book.rows.map(r => r.v[book.lay.kind]))];
  return `var(--c${names.indexOf(name) % 6})`;
}
// 分類のラベル。絞り込みと同じ名前（要確認事項は 種別 と 資料の指摘／その他、確認一覧は 資料の指摘／共通の問い／その他）
function groupTags(row) {
  const v = row.v, sheet = book.lay.sheet;
  if (sheet === "要確認事項") {
    const g = FINDING_KINDS.includes(v["理由"]) ? FINDING_LABEL : SHAPE_KINDS.includes(v["確認の分け方"]) ? OTHER_LABEL : "";
    return [v["種別"], g].filter(Boolean);
  }
  const k = v["区分"];
  return [FINDING_KINDS.includes(k) ? FINDING_LABEL : SHAPE_KINDS.includes(k) ? OTHER_LABEL : k];
}
const stateTag = row => `<span class="tag ${state(row)}">${STATE_NAME[state(row)]}</span>`;
const groupTagsHtml = row => groupTags(row).map(t => `<span class="tag">${esc(t)}</span>`).join("");
// おすすめを、答えと末尾の括弧（根拠など）に分ける（カードに出すだけ。xlsx に書くのは adviceAnswer）
function adviceParts(text) {
  let t = (text || "").trim().replace(/。$/, "");
  const notes = [];
  while (t.endsWith("）")) {
    const a = adviceAnswer(t);
    if (a === t) break;
    notes.unshift(t.slice(a.length).replace(/^（|）$/g, ""));
    t = a.trim();
  }
  return [t, notes];
}
// 補足：所見の1行と、資料の原文・現行や開発環境を左右に並べる（補足の無い行は何も出さない）
function suppHtml(v) {
  const s = supp[v["No."]];
  if (!s) return "";
  const seen = book.lay.sheet === "要確認事項" ? v["テーブル定義・現行・開発環境の記載"] : v["資料・開発環境の記載"];
  const real = seen && seen !== "－" && book.lay.sheet === "要確認事項" ? seen : "";
  const quotes = (s["原文"] || []).map(q => `<p class="quote"><span class="src">${esc(q["出典"])}</span>${esc(q["文"])}</p>`).join("")
    || `<p class="none">本文に書いていない</p>`;
  const imgs = (s["画像"] || []).map(m => `<img src="${esc(m.src)}" alt="${esc(m["説明"] || "")}"><span class="none">${esc(m["説明"] || "")}</span>`).join("");
  return (s["所見"] ? `<div class="seen"><b>所見</b>${esc(s["所見"])}</div>` : "") +
    `<div class="compare" ${real || imgs ? "" : 'style="grid-template-columns: 1fr"'}><div><h3>資料の原文</h3>${quotes}</div>` +
    (real || imgs ? `<div><h3>現行・開発環境</h3>${real ? `<p class="quote">${esc(real)}</p>` : ""}${imgs}</div>` : "") + `</div>`;
}
const same = (a, b) => !!b && (a || "").trim().replace(/。$/, "") === b.trim();
// 問いの最初の1文と残り
function splitLead(text) {
  const t = (text || "").trim(), m = t.match(/^[^。\n]*[。]?/);
  const lead = m ? m[0] : t;
  return [lead, t.slice(lead.length).trim()];
}
// 確認一覧の確認結果に書く値（前の作りの値も読めるようにする）
const RESULT_OF = { advice: "妥当", answer: "回答", ask: "QAに起票", hold: "保留", none: "不要" };
const KIND_OF = { "妥当": "advice", "回答": "answer", "違う": "answer", "QAに起票": "ask", "お客様に確認": "ask", "保留": "hold", "持ち帰り": "hold", "不要": "none" };

async function readBook(buf, name) {
  const entries = unzip(buf);
  const entry = p => entries.find(e => e.name === p);
  const parse = async p => new DOMParser().parseFromString(await entryText(entry(p)), "application/xml");
  const wb = await parse("xl/workbook.xml");
  const rels = await parse("xl/_rels/workbook.xml.rels");
  const target = {};
  for (const r of rels.getElementsByTagName("Relationship")) target[r.getAttribute("Id")] = r.getAttribute("Target");
  let shared = [];
  if (entry("xl/sharedStrings.xml")) {
    const ss = await parse("xl/sharedStrings.xml");
    shared = [...ss.getElementsByTagNameNS(NS, "si")].map(plain);
  }
  const sheets = {};
  for (const s of wb.getElementsByTagNameNS(NS, "sheet")) {
    const rid = s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
    const path = "xl/" + target[rid].replace(/^\/?xl\//, "");
    sheets[s.getAttribute("name")] = { path, doc: await parse(path) };
  }
  const lay = LAYOUTS.find(l => sheets[l.sheet]);
  if (!lay) throw new Error("「要確認事項」か「確認一覧」のシートがありません。受け入れ基準と要確認事項か、確認一覧の xlsx を選んでください");
  const doc = sheets[lay.sheet].doc;

  const grid = d => {
    const out = {}, style = {};
    for (const c of d.getElementsByTagNameNS(NS, "c")) {
      const ref = c.getAttribute("r");
      (out[rowOf(ref)] ??= {})[colOf(ref)] = cellText(c, shared);
      (style[rowOf(ref)] ??= {})[colOf(ref)] = c.getAttribute("s");
    }
    return { out, style };
  };
  const { out: g, style } = grid(doc);
  const heads = {};
  for (const [col, v] of Object.entries(g[1] || {})) if (v) heads[v] = col;
  for (const h of ["No.", lay.kind, lay.ask]) if (!heads[h]) throw new Error(`「${h}」の列がありません`);
  // 書く列が無ければ、右の端に足す（見出しは最後の見出しと同じ書式にする）
  const lastCol = Math.max(...Object.values(heads).map(colIndex));
  const added = [];
  for (const h of lay.edit) if (!heads[h]) { heads[h] = colName(lastCol + added.length + 1); added.push(h); }
  const bodyCol = colName(lastCol);
  const rows = Object.keys(g).map(Number).filter(r => r > 1 && g[r][heads["No."]]).sort((a, b) => a - b).map(r => {
    const v = {};
    for (const [h, col] of Object.entries(heads)) v[h] = g[r][col] ?? "";
    return { r, v, orig: Object.fromEntries(lay.edit.map(h => [h, v[h]])), style: style[r][bodyCol], saved: rowSaved(v), decided: !!(v["確認結果"] || v["回答"].trim()) };
  });
  const cover = sheets[COVER] ? Object.values(grid(sheets[COVER].doc).out).flatMap(r => Object.values(r)) : [];
  const sheetNo = [...wb.getElementsByTagNameNS(NS, "sheet")].findIndex(s => s.getAttribute("name") === lay.sheet);
  return { zip: entries, name, lay, sheets, sheetNo, heads, rows, cover, added, headStyle: style[1][colName(lastCol)] };
}

// ---------- 答えを列の値にする ----------
// おすすめの答えの部分。末尾の理由の括弧（「…（本文が…）」）を外す。答えの中の括弧は残す
function adviceAnswer(text) {
  const t = (text || "").trim().replace(/。$/, "");
  if (!t.endsWith("）")) return t;
  let depth = 0;
  for (let i = t.length - 1; i >= 0; i--) {
    if (t[i] === "）") depth++;
    else if (t[i] === "（" && --depth === 0) return i > 0 ? t.slice(0, i) : t;
  }
  return t;
}

function changes() {
  const out = [];
  for (const row of book.rows) for (const h of book.lay.edit) if (row.saved[h] !== row.orig[h]) out.push([row, h, row.saved[h]]);
  return out;
}

// ---------- xlsx に戻す（書く列のセルだけを書き換える） ----------
function setCell(doc, ref, text, style) {
  const sheetData = doc.getElementsByTagNameNS(NS, "sheetData")[0];
  const r = rowOf(ref);
  const row = [...sheetData.getElementsByTagNameNS(NS, "row")].find(x => +x.getAttribute("r") === r);
  if (!row) throw new Error(`行 ${r} が見つかりません`);
  let c = [...row.getElementsByTagNameNS(NS, "c")].find(x => x.getAttribute("r") === ref);
  if (!c) {
    c = doc.createElementNS(NS, "c");
    c.setAttribute("r", ref);
    if (style) c.setAttribute("s", style);
    const after = [...row.getElementsByTagNameNS(NS, "c")].find(x => colIndex(colOf(x.getAttribute("r"))) > colIndex(colOf(ref)));
    row.insertBefore(c, after || null);
    row.removeAttribute("spans");
  }
  while (c.firstChild) c.removeChild(c.firstChild);
  if (text === "") { c.setAttribute("t", "n"); return; }
  c.setAttribute("t", "inlineStr");
  const is = doc.createElementNS(NS, "is"), t = doc.createElementNS(NS, "t");
  t.setAttribute("xml:space", "preserve");
  t.textContent = text;
  is.appendChild(t); c.appendChild(is);
}

async function writeBook() {
  const sh = book.sheets[book.lay.sheet];
  if (book.added.length) {
    // 足した列：見出し・列の幅・表の範囲・絞り込みの範囲
    for (const h of book.added) setCell(sh.doc, book.heads[h] + 1, h, book.headStyle);
    const d = sh.doc, last = colName(Math.max(...Object.values(book.heads).map(colIndex)));
    let cols = d.getElementsByTagNameNS(NS, "cols")[0];
    if (!cols) { cols = d.createElementNS(NS, "cols"); d.documentElement.insertBefore(cols, d.getElementsByTagNameNS(NS, "sheetData")[0]); }
    for (const h of book.added) {
      const n = colIndex(book.heads[h]), have = [...cols.getElementsByTagNameNS(NS, "col")];
      // 幅がもう決まっている列には足さない（範囲が重なると Excel が修復を求める）
      if (have.some(x => +x.getAttribute("min") <= n && n <= +x.getAttribute("max"))) continue;
      const c = d.createElementNS(NS, "col");
      c.setAttribute("min", n); c.setAttribute("max", n); c.setAttribute("width", "40"); c.setAttribute("customWidth", "1");
      cols.insertBefore(c, have.find(x => +x.getAttribute("min") > n) || null);
    }
    const dim = d.getElementsByTagNameNS(NS, "dimension")[0];
    if (dim) dim.setAttribute("ref", dim.getAttribute("ref").replace(/:[A-Z]+(\d+)$/, `:${last}$1`));
    const filter = d.getElementsByTagNameNS(NS, "autoFilter")[0];
    if (filter) {
      filter.setAttribute("ref", filter.getAttribute("ref").replace(/:[A-Z]+(\d+)$/, `:${last}$1`));
      // 絞り込みの範囲は workbook.xml の名前にもある。同じにそろえる
      const e = book.zip.find(x => x.name === "xl/workbook.xml");
      const text = (await entryText(e)).replace(new RegExp(`(<definedName name="_xlnm._FilterDatabase" localSheetId="${book.sheetNo}"[^>]*>[^<]*:\\$)[A-Z]+(\\$\\d+<)`), `$1${last}$2`);
      await setEntryText(e, text);
    }
  }
  for (const [row, h, text] of changes()) setCell(sh.doc, book.heads[h] + row.r, text, row.style);
  await setEntryText(book.zip.find(e => e.name === sh.path), new XMLSerializer().serializeToString(sh.doc));
  return zip(book.zip);
}

// ---------- 画面 ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

// 押したボタン（決定したもの／今カードに入っているもの）。確認結果の値から読む
const savedKind = row => KIND_OF[row.saved["確認結果"]] || "";
const nowKind = row => KIND_OF[row.v["確認結果"]] || "";
function rowSaved(v) { return { "確認結果": v["確認結果"], "回答": v["回答"], "備考": v["備考"], "QA起票文": v["QA起票文"] }; }
// 決定していない入力があるか（備考は、決定した備考から変えたときだけ）
function hasInput(row) { return !!(nowKind(row) || row.v["回答"].trim() || (row.v["備考"] || "") !== (row.saved["備考"] || "")); }

// 決定できるか：ボタンを押していて、「回答を書く」なら回答の欄に答えがある。
// 決め直しでボタンを全部外したときは、前の答えを消すために決定できる
function canDecide(row) {
  const k = nowKind(row);
  if (!k) return !!savedKind(row);
  return k !== "answer" || row.v["回答"].trim() !== "";
}

// 一覧の印：決定済み（保留は別の色）／決め直し中（前に決めた答えのまま保存される）／書きかけ／未回答
function state(row) {
  if (row.decided) return savedKind(row) === "hold" ? "hold" : "done";
  if (savedKind(row)) return "redo";
  return hasInput(row) ? "draft" : "";
}
const STATE_NAME = { done: "決定済み", hold: "保留", redo: "決め直し中", draft: "書きかけ", "": "未回答" };

function decide(i) {
  const row = book.rows[i], v = row.v, k = nowKind(row);
  // 押したボタンで使わない欄（回答・起票する質問の文）は空にしてから決める（xlsx にも控えにも残さない）
  if (k !== "answer") v["回答"] = "";
  if (k !== "ask") v["QA起票文"] = "";
  row.saved = rowSaved(v);
  row.decided = !!k;   // ボタンを全部外して決めたら、答えを消して未回答に戻す
  if (!k) return refresh();
  // 次の、まだ決めていない1枚へ（無ければ今の1枚のまま。完了を出す）
  const n = book.rows.length;
  for (let d = 1; d < n; d++) { const j = (i + d) % n; if (!book.rows[j].decided) return go(j); }
  refresh();
}

function redo(i) {   // 決め直す：決定した答えをカードに戻して、書き換えられるようにする
  const row = book.rows[i];
  Object.assign(row.v, row.saved);
  row.decided = false;
  refresh();
}

function filters() {
  const lay = book.lay.filters(book.rows);
  const sub = [["保留", r => r.decided && savedKind(r) === "hold"], ["QAに起票", r => r.decided && savedKind(r) === "ask"]];
  return [["すべて", () => true], ["未回答", r => !r.decided], ["書きかけ", r => ["draft", "redo"].includes(state(r))], ...sub, ...lay];
}

function visible() {
  const pass = (filters().find(([k]) => k === filter) || filters()[0])[1];
  return book.rows.map((r, i) => [r, i]).filter(([r]) => pass(r));
}

function counts(rs = book.rows) {
  const dec = rs.filter(r => r.decided);
  return {
    n: rs.length, done: dec.length, drafts: rs.filter(r => state(r) === "draft").length, redos: rs.filter(r => state(r) === "redo").length,
    hold: dec.filter(r => savedKind(r) === "hold").length, ask: dec.filter(r => savedKind(r) === "ask").length,
    advice: dec.filter(r => savedKind(r) === "advice").length,
  };
}

function renderCheck() {
  const lines = book.lay.check(book.rows, book.cover);
  const ok = lines.every(([, got, want]) => got === want);
  const { n, done, hold, ask, drafts, redos } = counts();
  $("check").innerHTML =
    `<div class="row"><span>読み込んだ行（シート「${esc(book.lay.sheet)}」）</span><b>${book.rows.length} 件</b></div>` +
    `<div class="row"><span>件数（読み込んだ行 / 表紙）</span><span></span></div>` +
    lines.map(([k, got, want]) => `<div class="row"><span>${esc(k)}</span><span class="${got === want ? "" : "bad"}">${got} / ${want ?? "表紙に無い"}</span></div>`).join("") +
    `<div class="row"><span>表紙と合っているか</span><span class="${ok ? "good" : "bad"}">${ok ? "合っている" : "合っていない"}</span></div><hr>` +
    `<div class="row"><span>決定した行</span><b>${done} / ${n}</b></div>` +
    `<div class="row"><span>書きかけ（保存されない）</span><b class="${drafts ? "bad" : ""}">${drafts}</b></div>` +
    (redos ? `<div class="row"><span>決め直し中（前の答えのまま保存される）</span><b class="bad">${redos}</b></div>` : "") +
    `<div class="row"><span>　うち保留</span><b>${hold}</b></div>` +
    `<div class="row"><span>　うちQAに起票</span><b>${ask}</b></div>`;
  $("progress").textContent = `決定 ${done} / ${n}`;
  $("checksum").innerHTML = `件数の点検：<span class="${ok ? "" : "bad"}">${ok ? "表紙と合っている" : "表紙と合っていない"}</span>` +
    `・書きかけ <span class="${drafts ? "bad" : ""}">${drafts}</span>・保留 ${hold}・QAに起票 ${ask}` + (redos ? `・<span class="bad">決め直し中 ${redos}</span>` : "");
  if (!ok) $("checkwrap").open = true;
  $("filters").innerHTML = filters().map(([k]) => `<button data-f="${esc(k)}" class="${k === filter ? "on" : ""}" aria-pressed="${k === filter}">${esc(k)}</button>`).join("");
}

function label(row) {
  const item = row.v["項目"];
  const generic = !item || item.startsWith(row.v[book.lay.kind]) || (row.v["理由"] && item.startsWith(row.v["理由"])) || FINDING_KINDS.some(k => item.startsWith(k));
  const text = generic ? splitLead(row.v[book.lay.ask])[0] : item;
  return text.length > 34 ? text.slice(0, 34) + "…" : text;
}

function renderList() {
  $("list").innerHTML = visible().map(([row, i]) =>
    `<div class="item ${state(row)} ${i === cur ? "cur" : ""}" style="--kc: ${kindColor(row.v[book.lay.kind])}" data-i="${i}" role="button" tabindex="0" aria-current="${i === cur}" aria-label="${esc(row.v["No."])}（${STATE_NAME[state(row)]}）" title="${esc(row.v["No."])}（${STATE_NAME[state(row)]}）\n${esc(label(row))}">` +
    `<div class="tags">${stateTag(row)}${groupTagsHtml(row)}<span class="no">${esc(row.v["No."])}</span></div>${esc(label(row))}</div>`).join("");
  // 絞り込んでいれば、絞り込んだ行だけの進み具合
  const c = counts(visible().map(([r]) => r)), n = Math.max(c.n, 1), ok = c.done - c.hold, pc = x => (x / n * 100).toFixed(2) + "%";
  $("bar").innerHTML = `<span class="done" style="width:${pc(ok)}"></span><span class="hold" style="width:${pc(c.hold)}"></span>` +
    `<span class="draft" style="width:${pc(c.drafts + c.redos)}"></span>`;
  $("bar").setAttribute("aria-label", `決定 ${c.done} / ${c.n}`);
  $("bartext").innerHTML = (filter !== "すべて" ? `${esc(filter)}：` : "") + `<b>決定 ${c.done} / ${c.n}（${Math.round(c.done / n * 100)}%）</b>` +
    `<span class="k" style="background:var(--ok)"></span>決定済み ${ok}<span class="k" style="background:var(--warn)"></span>保留 ${c.hold}` +
    `<span class="k" style="background:var(--accent);opacity:.55"></span>書きかけ ${c.drafts + c.redos}<span class="k" style="background:var(--line)"></span>未回答 ${c.n - c.done - c.drafts - c.redos}`;
  const el = $("list").querySelector(".cur");
  if (el) el.scrollIntoView({ block: "nearest" });
}

function renderCard() {
  const row = book.rows[cur], v = row.v, lay = book.lay;
  const extra = lay.more.filter(h => v[h] && v[h] !== "－");
  const locked = row.decided, c = counts();
  let html = "";
  if (c.done === c.n) {
    html += `<div class="box advice" id="complete"><b>全部決定しました</b>` +
      `${c.n} 行のうち、おすすめどおり ${c.advice}・QAに起票 ${c.ask}・保留 ${c.hold}・そのほか ${c.n - c.advice - c.ask - c.hold}` +
      `\n<button class="primary" id="saveDone">答えを入れた xlsx を保存</button></div>`;
  }
  const sameAsKind = !v["項目"] || v["項目"].startsWith(v[lay.kind]);
  const title = sameAsKind ? (v[lay.where] || v[lay.kind]) : v["項目"];
  const sub = sameAsKind ? v["項目"] : v[lay.where];
  const [lead, rest] = splitLead(v[lay.ask]);
  const [idea, why] = adviceParts(v["AI のおすすめ"]);
  html += `<div class="cbody">` +
    `<div class="meta"><span class="kind">${stateTag(row)}${groupTagsHtml(row)}</span><span>${esc(v["No."])}</span>` +
    `<span class="pos">${cur + 1} / ${book.rows.length}</span></div>` +
    `<h2 class="title">${esc(title)}</h2>` + (sub && sub !== title ? `<div class="where">${esc(sub)}</div>` : "") +
    // おすすめでいいかの問いは、問いの文が AI の案と同じなので、案だけを出す
    (same(v[lay.ask], idea) ? "" : `<p class="lead">${esc(lead)}</p>` + (rest ? `<p class="rest">${esc(rest)}</p>` : "")) +
    (idea ? `<div class="idea"><div class="tag">AI の案</div><div class="main">${esc(idea)}</div>` +
      (why.length ? `<div class="why">${esc(why.join("\n"))}</div>` : "") + `</div>` : "") +
    suppHtml(v) +
    (v["確かめ方"] ? `<div class="how"><b>確かめ方</b>${esc(v["確かめ方"])}</div>` : "") +
    extra.map(h => `<details><summary>${esc(h)}</summary><div class="box">${esc(v[h])}</div></details>`).join("") +
    `</div>`;
  const k = nowKind(row), ro = locked ? "readonly" : "";
  html += `<div class="answer"><div class="results">` +
    KINDS.filter(([key]) => key !== "advice" || v["AI のおすすめ"])   // おすすめの無い問いには、おすすめどおりを出さない
      .map(([key, name]) => `<button data-kind="${key}" class="${k === key ? "on" : ""}" aria-pressed="${k === key}" aria-label="${esc(name)}" ${locked ? "disabled" : ""}>` +
        `<span class="ic">${KIND_ICON[key]}</span><span>${esc(name)}</span><span class="key">${KINDS.findIndex(([x]) => x === key) + 1}</span></button>`).join("") +
    `</div>` +
    (k === "advice" ? `<div class="box advice"><b>回答</b>${esc(adviceAnswer(v["AI のおすすめ"]))}</div>` : "") +
    (k === "answer" ? `<label for="ans">回答</label><textarea id="ans" ${ro}></textarea>` : "") +
    (k === "ask" ? `<label for="qa">起票する質問の文（直せます）</label><textarea id="qa" rows="4" ${ro}></textarea>` : "") +
    `<label for="memo">備考</label><textarea id="memo" placeholder="備考（どのボタンでも書けます）" ${ro}></textarea>` +
    (!locked && !k && savedKind(row) ? `<div class="box">ボタンを全部外して決定すると、前に決めた答え（${esc(row.saved["確認結果"])}）を消して未回答に戻します</div>` : "");
  const shown = visible().map(([, i]) => i), at = shown.indexOf(cur);
  html += `<div class="nav"><button id="prev" ${at === 0 ? "disabled" : ""} title="←">←</button>` +
    (locked ? `<button id="redo">決め直す</button>` : `<button class="primary" id="decide" ${canDecide(row) ? "" : "disabled"} title="Enter">${!k && savedKind(row) ? "答えを消す" : "決定して次へ"}</button>`) +
    `<button id="next" ${at === shown.length - 1 ? "disabled" : ""} title="→">→</button></div></div>`;
  $("card").innerHTML = html;
  // 文字は value で入れる（HTML として読ませない）。回答・起票する質問の文・備考の欄は、列の値に入れる
  if (k === "ask" && !locked && !v["QA起票文"]) v["QA起票文"] = v[lay.ask];   // 初めは業務向けの問いの文
  for (const [id, key] of [["ans", "回答"], ["qa", "QA起票文"], ["memo", "備考"]]) {
    if (!$(id)) continue;
    $(id).value = v[key] ?? "";
    $(id).addEventListener("input", e => { v[key] = e.target.value; inputChanged(); });
    if (id === "memo" && v[key]) $(id).classList.add("has");
  }
}

// 打っている間：決定のボタンを押せるかと、左の一覧を直す
function inputChanged() {
  const d = $("decide");
  if (d) d.disabled = !canDecide(book.rows[cur]);
  refreshSide();
}

let sideTimer = null;
function refreshSide() {   // 打っている間は、左の一覧を少し待ってから作り直す
  clearTimeout(sideTimer);
  sideTimer = setTimeout(() => refresh(false), 300);
}

// ---------- 控え：カードで入れたものを、このブラウザの中にだけ残す（読み込み直しても戻せるように） ----------
// 保存し直すとブラウザが名前に「 (1)」などを付けるので、それを外した名前で控える・保存する
const baseName = () => book.name.replace(/\s*\(\d+\)(?=\.xlsx$)/i, "");
const draftKey = () => `確認一覧カード｜${baseName()}｜${book.lay.sheet}`;

function snapshot() {
  const out = {};
  for (const row of book.rows) out[row.v["No."]] = { q: row.v[book.lay.ask], now: rowSaved(row.v), decided: row.decided, saved: row.saved };
  return out;
}

function saveDraft() {
  try { localStorage.setItem(draftKey(), JSON.stringify({ at: new Date().toLocaleString("ja-JP"), items: snapshot() })); } catch (e) { /* 控えられなくても、ページは動く */ }
}

// 知らせの欄に文（とボタン）を出す。buttons：[[id, 文字, 押したとき]]
function notice(text, buttons = []) {
  $("notice").innerHTML = esc(text) + (buttons.length ? "<br>" + buttons.map(([id, name]) => `<button id="${id}">${esc(name)}</button>`).join("") : "");
  for (const [id, , fn] of buttons) $(id).addEventListener("click", () => { $("notice").textContent = ""; fn(); });
}

// 同じ xlsx（名前とシートが同じ）の控えがあり、今の中身と違えば、戻すかを訊く（知らせの欄のボタンで）。
// 答えてからカードを出す（答える前に入れたものを、あとで控えで上書きしないように）。
// 前の作り（要確認事項を小問に分けていたとき）の控えは、行の No. と合わないので戻さない
function restoreDraft(start) {
  let stored;
  try { stored = JSON.parse(localStorage.getItem(draftKey()) || "null"); } catch (e) { return start(); }
  if (!stored) return start();
  const now = snapshot(), back = [];
  for (const row of book.rows) {
    const key = row.v["No."], s = stored.items[key];
    if (s && s.q === now[key].q && s.now && s.saved && JSON.stringify(s) !== JSON.stringify(now[key])) back.push([row, s]);
  }
  if (!back.length) return start();
  const dec = back.filter(([, s]) => s.decided).length;
  notice(`前回（${stored.at}）にこのファイルで入れたものが残っています（${back.length} 件。うち決定 ${dec}・書きかけ ${back.length - dec}）。続きから始めますか？`,
    [["restoreYes", "続きから始める", () => { applyDraft(back); start(); }], ["restoreNo", "xlsx に書いてあるとおりで始める", start]]);
}

function applyDraft(back) {
  for (const [row, s] of back) { Object.assign(row.v, s.now); row.decided = s.decided; row.saved = s.saved; }
}

function refresh(card = true) {
  renderCheck(); renderList(); if (card) renderCard();
  saveDraft();
  const n = changes().length + (book.added.length && changes().length ? book.added.length : 0);
  $("dirty").textContent = n ? `保存していない書き換え ${n} セル` : "";
  $("save").disabled = n === 0;
  $("qaout").disabled = !qaRows().length;
}

function go(i) { cur = Math.max(0, Math.min(book.rows.length - 1, i)); refresh(); }

function status(text, bad = false) { $("status").textContent = text; $("status").style.color = bad ? "var(--warn)" : "var(--sub)"; }

async function openFile(file) {
  try {
    status(`${file.name} を読んでいます…（ファイルを開く）`);
    const buf = await file.arrayBuffer();
    status(`${file.name} を読んでいます…（中の表を読む）`);
    book = await readBook(buf, file.name);
    $("fname").textContent = file.name;
    $("drop").style.display = "none";
    $("main").classList.remove("on");
    restoreDraft(() => {
      cur = Math.max(0, book.rows.findIndex(r => !r.decided)); filter = "すべて";
      $("main").classList.add("on");
      refresh();
    });
  } catch (e) {
    status(`読み込めませんでした：${e.message || e}`, true);
  }
}
if (!("DecompressionStream" in window)) status("このブラウザでは動きません。新しい Edge か Chrome で開いてください。", true);
else status("動いています。xlsx を選んでください。");

async function openFiles(files) {
  const list = [...files];
  for (const f of list.filter(f => /\.json$/i.test(f.name))) {
    try { supp = JSON.parse(await f.text()).items || {}; } catch (e) { status(`補足を読めませんでした：${e.message}`, true); }
  }
  const x = list.find(f => /\.xlsx$/i.test(f.name));
  if (x) await openFile(x);
  else if (book) refresh();
}
$("pick").addEventListener("change", e => openFiles(e.target.files));
const drop = $("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); openFiles(e.dataTransfer.files); });
$("filters").addEventListener("click", e => {
  if (e.target.dataset.f === undefined) return;
  filter = e.target.dataset.f;
  const shown = visible();
  if (shown.length && !shown.some(([, i]) => i === cur)) cur = shown[0][1];
  refresh();
});
$("list").addEventListener("click", e => { const it = e.target.closest(".item"); if (it) { listOpen(false); go(+it.dataset.i); } });
// 一覧：三本線で開け閉めする。選んだら閉じる。外を押す・Esc でも閉じる
function listOpen(open) {
  if (!book) return;
  $("main").classList.toggle("listopen", open);
  $("listbar").setAttribute("aria-expanded", open);
  if (open) $("list").querySelector(".cur")?.scrollIntoView({ block: "center" });
}
$("listbar").addEventListener("click", () => listOpen(!$("main").classList.contains("listopen")));
$("sideclose").addEventListener("click", () => listOpen(false));
document.addEventListener("click", e => { if ($("main").classList.contains("listopen") && !e.target.closest("#side, #listbar")) listOpen(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") listOpen(false); });
$("list").addEventListener("keydown", e => { const it = e.target.closest(".item"); if (it && e.key === "Enter") go(+it.dataset.i); });
$("card").addEventListener("click", e => {
  const kb = e.target.closest("[data-kind]");
  if (kb) {   // もう一度押すと外す
    const row = book.rows[cur], k = kb.dataset.kind;
    row.v["確認結果"] = nowKind(row) === k ? "" : RESULT_OF[k];
    refresh();
    const f = $({ answer: "ans", ask: "qa" }[nowKind(row)]);
    if (f) f.focus();
  }
  if (e.target.id === "decide") decide(cur);
  if (e.target.id === "redo") redo(cur);
  if (e.target.id === "saveDone") $("save").click();
  if (e.target.id === "prev") step(-1);
  if (e.target.id === "next") step(1);
});

// 前・次のカードへ（左の一覧で絞っていれば、その中で）
function step(d) {
  const shown = visible().map(([, i]) => i);
  if (!shown.length) return;
  const at = shown.indexOf(cur);
  const to = at < 0 ? shown[0] : shown[at + d];
  if (to === undefined) return;
  go(to);
  // 送ったカードの頭から読めるように
  const top = $("card").getBoundingClientRect().top + window.scrollY - 8;
  if (window.scrollY > top) window.scrollTo(0, top);
}

// 矢印：← → で前・次（↑ ↓ とホイールは、ページを動かすだけ）
const typing = el => el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT");
document.addEventListener("keydown", e => {
  if (!book || typing(document.activeElement) || e.ctrlKey || e.altKey || e.metaKey) return;
  const d = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
  if (d) { e.preventDefault(); step(d); return; }
  const b = /^[1-5]$/.test(e.key) && $("card").querySelector(`[data-kind="${KINDS[+e.key - 1][0]}"]`);
  if (/^[1-5]$/.test(e.key) && b && !b.disabled) { e.preventDefault(); b.click(); return; }
  if (e.key === "Enter" && !e.target.closest?.("button, .item, summary") && $("decide") && !$("decide").disabled) { e.preventDefault(); $("decide").click(); }
});
$("save").addEventListener("click", async () => {
  const ch = changes();
  const blob = await writeBook();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = baseName(); a.click();
  for (const [row, h, text] of ch) row.orig[h] = text;
  book.added = [];
  refresh(false);
  const { drafts, redos } = counts();
  notice(`決定した答えで ${ch.length} セルを書き換えて保存しました（${book.lay.edit.join("・")} の列だけ）。ほかのセルは元のままです。` +
    (drafts ? `\n書きかけの ${drafts} 件は、決定していないので保存していません。` : "") +
    (redos ? `\n決め直し中の ${redos} 件は、前に決めた答えのまま保存しました。` : ""));
});
// ---------- 起票分（QA表に貼る行）----------
// 「QAに起票」にして決定したものだけを、QA表の列の並び（No・現行機能・対象・質問・確認の内容・BlueMemeの案・参考資料）で出す。No. は QA表で振るので空
const QA_ASK = "QAに起票";
// QA表の形：B 列から、表題（1〜3 行）・見出し（5 行）・行（6 行から）。黄色の欄（回答・回答者・回答日・ステータス）はお客様が書く
const QA_HEAD = ["No", "現行機能", "対象", "質問・確認の内容", "BlueMemeの案", "参考資料", "回答", "回答者", "回答日", "ステータス"];
const QA_YELLOW = 6;   // QA_HEAD のこの番号から右が黄色の欄
const QA_TITLE = ["詳細仕様QA表（起票分）", "作成：BlueMeme", "黄色の欄（回答・回答者・回答日・ステータス）にご記入ください。当社の案でよければ、回答欄に「案のとおり」とだけ書いていただけますと幸いです。"];
// 決定して「QAに起票」にしたもの。[対象, 質問の文, 案]
function qaRows() {
  if (!book) return [];
  return book.rows.filter(r => r.decided && savedKind(r) === "ask").map(r => {
    const v = r.v, s = r.saved, where = v["どこのことか"];
    // 資料の食い違い・書き漏れの行は、項目が区分と同じなので、どこのことかを添える
    const target = where && FINDING_KINDS.some(k => v["項目"].startsWith(k)) ? `${v["項目"]}（${where}）` : v["項目"];
    const usual = (v["区分"] || v["確認の分け方"]) === "ふつうはこうする";
    return [target, (s["QA起票文"] || "").trim() || v[book.lay.ask], adviceAnswer(v["AI のおすすめ"]) || (usual ? v[book.lay.ask] : "")];
  });
}
// 表紙の「<key>」の右の値（表紙は見出しと値が交互に並ぶ。値が無いときは「－」が入る）
function coverValue(key) {
  const i = book.cover.indexOf(key);
  const v = i < 0 ? "" : String(book.cover[i + 1] ?? "");
  return v === "－" ? "" : v;
}
async function qaBook(rows) {
  const name = baseName().replace(/_(確認一覧|受け入れ基準と要確認事項)_.*$/, "").replace(/\.xlsx$/, "");
  const current = coverValue("現行機能");
  const lines = rows.map(([target, question, plan]) => ["", current, target, question, plan, `機能要件詳細「${name}」`, "", "", "", ""]);
  const x = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // 書式の番号（styles.xml の cellXfs の順）：1 表題、2 見出し、3 黄色の見出し、4 行、5 黄色の行、6 表題の下の文
  const cell = (s, c, r, st) => `<c r="${colName(c)}${r}" t="inlineStr" s="${st}"><is><t xml:space="preserve">${x(s)}</t></is></c>`;
  const row = (r, cells, st, yst) => `<row r="${r}">${cells.map((s, c) => cell(s, c + 2, r, c >= QA_YELLOW ? yst : st)).join("")}</row>`;
  const last = 5 + lines.length;
  const sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${NS}">` +
    `<sheetViews><sheetView workbookViewId="0" showGridLines="0"><pane ySplit="5" topLeftCell="A6" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>` +
    `<cols>${[2, 5, 18, 18, 64, 40, 24, 30, 10, 10, 10].map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>` +
    QA_TITLE.map((s, i) => `<row r="${i + 1}">${cell(s, 2, i + 1, i ? 6 : 1)}</row>`).join("") +
    row(5, QA_HEAD, 2, 3) + lines.map((cells, i) => row(6 + i, cells, 4, 5)).join("") +
    `</sheetData><autoFilter ref="B5:${colName(1 + QA_HEAD.length)}${Math.max(last, 6)}"/></worksheet>`;
  const files = {
    "[Content_Types].xml": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`,
    "_rels/.rels": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`,
    "xl/workbook.xml": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="QA一覧" sheetId="1" r:id="rId1"/></sheets>` +
      `<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'QA一覧'!$B$5:$${colName(1 + QA_HEAD.length)}$${Math.max(last, 6)}</definedName></definedNames></workbook>`,
    "xl/_rels/workbook.xml.rels": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`,
    "xl/worksheets/sheet1.xml": sheet,
    "xl/styles.xml": `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}">` +
      `<fonts count="3"><font><sz val="10"/><name val="Meiryo UI"/></font><font><b/><sz val="14"/><name val="Meiryo UI"/></font><font><b/><sz val="10"/><name val="Meiryo UI"/></font></fonts>` +
      `<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>` +
      `<fill><patternFill patternType="solid"><fgColor rgb="FFD9D9D9"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFFFF00"/><bgColor indexed="64"/></patternFill></fill></fills>` +
      `<borders count="2"><border/><border><left style="thin"/><right style="thin"/><top style="thin"/><bottom style="thin"/><diagonal/></border></borders>` +
      `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="7">` +
      `<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>` +
      `<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>` +
      `<xf numFmtId="0" fontId="2" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>` +
      `<xf numFmtId="0" fontId="2" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>` +
      `<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>` +
      `<xf numFmtId="0" fontId="0" fillId="3" borderId="1" xfId="0" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>` +
      `<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>` +
      `</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`,
  };
  const entries = [];
  for (const [n, text] of Object.entries(files)) {
    const e = { name: n, time: 0, date: 0x21 };
    await setEntryText(e, text);
    entries.push(e);
  }
  return { blob: zip(entries), file: `${name}_QA起票.xlsx` };
}
$("qaout").addEventListener("click", async () => {
  const rows = qaRows();
  const { blob, file } = await qaBook(rows);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = file; a.click();
  notice(`「${QA_ASK}」にして決定した ${rows.length} 件を、QA表の列の並びで ${file} に出しました。元の一覧の行はそのまま残ります。`);
});
// ページを離れるときの「このサイトを離れますか」は出さない（AI がブラウザを操作するときに止まるため）。書きかけはこのブラウザの控えに残り、開き直すと戻せる
</script>
